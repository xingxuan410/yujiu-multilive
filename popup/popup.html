<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src https: data:">
  <title>开播通知</title>
  <style>
    html, body {
      background: transparent;
      margin: 0;
      overflow: hidden;
      user-select: none;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }

    .card {
      width: 340px;
      height: 96px;
      border-radius: 12px;
      background: #1e1e26;
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
      display: flex;
      padding: 10px;
      box-sizing: border-box;
      cursor: pointer;
    }

    .cover-box {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      background: #2a2a35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .content {
      flex: 1;
      min-width: 0;
      margin-left: 10px;
      position: relative;
    }

    .headline {
      display: flex;
      align-items: center;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      padding-right: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fb7299;
      flex-shrink: 0;
      margin-right: 6px;
    }

    .name {
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .live-text {
      color: #9a9aa8;
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 4px;
    }

    .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #9a9aa8;
      margin-top: 4px;
    }

    .meta {
      font-size: 12px;
      color: #fb7299;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a9aa8;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, .1);
    }

    .bar {
      height: 3px;
      background: rgba(255, 255, 255, .06);
      margin-top: 5px;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      background: #fb7299;
      transition: width 10000ms linear;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="cover-box">
      <div class="cover-placeholder" id="placeholder">📺</div>
      <img id="cover" alt="" style="display:none;">
    </div>
    <div class="content">
      <div class="headline">
        <span class="dot"></span>
        <b class="name" id="name"></b>
        <span class="live-text">开播了</span>
      </div>
      <div class="title" id="title"></div>
      <div class="meta" id="meta"></div>
      <div class="close-btn" id="closeBtn">✕</div>
    </div>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <script src="popup-preload.js"></script>
  <script src="popup.js"></script>
</body>
</html>
